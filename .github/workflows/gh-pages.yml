name: GitHub Pages

# Publishes MkDocs (mkdocs.yml) to GitHub Pages on every push to master.
# Pages source: Settings → Pages → Build and deployment → GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            flex libfl-dev bison swig tcl-dev libeigen3-dev ninja-build wget

      - name: Build sta and generate command docs
        run: bash etc/build_sta.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r doc/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
